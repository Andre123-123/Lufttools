<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lufttools</title>
  <meta name="description" content="Strömungstechnische Rechenhilfen: Umrechner, Druckverlust, Geometrie">
  <meta name="theme-color" content="#0057b8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lufttools">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Design vor dem ersten Zeichnen setzen (kein Aufblitzen)
    try { const t = localStorage.getItem('lt.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="back" class="back-btn" type="button" aria-label="Zurück" hidden>‹</button>
    <h1 id="title">Lufttools</h1>
    <button id="theme" class="theme-btn" type="button" aria-label="Hell/Dunkel umschalten">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <a href="#/" class="logo" aria-label="Startseite"><img src="icons/icon.svg" alt=""></a>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Bitte JavaScript aktivieren.</noscript>
</body>
</html>
